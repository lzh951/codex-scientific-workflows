name: Temporary Offline ASR Bundle

on:
  push:
    branches:
      - tmp-offline-asr-20260820
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download compact multilingual model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p model
          curl -fL --retry 5 --retry-delay 2 \
            -o model/ggml-tiny-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
          sha256sum model/* > model/SHA256SUMS.txt

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: offline-asr-tiny-model
          path: model
          retention-days: 1
          compression-level: 0
