name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    name: Python syntax check
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile public tools
        run: python -m py_compile tools/origin_batch_plot.py tools/prepare_ppt_version.py
